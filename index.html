<h1>OPTIMUS</h1>
<p>OPTIMUS는 한 사람이 자기 노트북에서만 쓰는 개인 비서 프로그램입니다. 공개 서비스가 아니며, 다른 사람의 계정을 연결하지 않습니다.</p>
<p>Google 계정은 사용자 본인의 Gmail·Google Calendar·Google Assistant를 사용자 요청에 따라 조회하고, 사용자가 승인한 경우에만 메일 발송·일정 변경·기기 명령을 하기 위해 연결합니다.</p>
